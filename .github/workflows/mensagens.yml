# Despacha a fila de mensagens (confirmações e lembretes 24h) a cada 5 minutos.
# O cron da Vercel no plano Hobby só roda uma vez por dia; este agendador gratuito cobre o intervalo.
#
# Configuração (GitHub → Settings → Secrets and variables → Actions):
#   - Secret   CRON_SECRET: o mesmo valor da variável CRON_SECRET do projeto na Vercel.
#   - Variable APP_URL (opcional): endereço público do app; padrão https://bss-six.vercel.app
# Sem CRON_SECRET o job só avisa e termina sem erro.
name: Mensagens agendadas

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mensagens
  cancel-in-progress: false

jobs:
  despachar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar o despacho da fila
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://bss-six.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET não configurado neste repositório; nada a fazer."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 60 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/mensagens"
